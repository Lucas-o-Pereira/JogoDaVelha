<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo da Velha</title>
    <link rel="stylesheet" href="style.css" />
    <script src="style.js" defer></script>
  </head>
  <body>
      <div class="container">
      <h1>Jogo da Velha</h1>
        <table class="jogo" border="1">
          <tr>
            <td class="quadrado" onclick="jogar(this)"></td>
            <td class="quadrado" onclick="jogar(this)" data-cell-index="1"></td>
            <td class="quadrado" onclick="jogar(this)" data-cell-index="2"></td>
          </tr>
          <tr>
            <td class="quadrado" onclick="jogar(this)" data-cell-index="3"></td>
            <td class="quadrado" onclick="jogar(this)" data-cell-index="4"></td>
            <td class="quadrado" onclick="jogar(this)" data-cell-index="5"></td>
          </tr>
          <tr>
            <td class="quadrado" onclick="jogar(this)" data-cell-index="6"></td>
            <td class="quadrado" onclick="jogar(this)" data-cell-index="7"></td>
            <td class="quadrado" onclick="jogar(this)" data-cell-index="8"></td>
          </tr>
        </table>
             <button onclick="location.reload()">Reiniciar</button>
      </div>
    </div>

    <h2>Modo claro e escuro</h2>
    <div class="trilho" id="trilho">
          <div class="indicador"></div>
    </div>
  </body>
</html>
